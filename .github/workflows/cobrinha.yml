name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v2
        with:
          github_user_name: rafaelvieiramaximo
          svg_out_path: ./assets/github-snake.svg
          svg_out_path_dark: ./assets/github-snake-dark.svg

      - name: Push to GitHub
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: ./assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
